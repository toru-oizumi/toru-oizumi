name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: toru-oizumi
          BRANCH_NAME: main
          # Asia/Tokyo. Productive Time カードの時間帯集計に使う
          UTC_OFFSET: 9
          EXCLUDE: "html,css"
          THEME: radical
          AUTO_PUSH: true
